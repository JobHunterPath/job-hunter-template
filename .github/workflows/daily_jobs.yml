name: Job Hunt Pipeline

on:
  schedule:
    - cron: '0 6 * * 1-5'   # daily job hunt Mon-Fri 6am UTC
    - cron: '0 7 * * 1'     # company discovery Mondays 7am UTC
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run'
        required: true
        default: 'hunt'
        type: choice
        options:
          - hunt
          - discover
          - both

jobs:

  # ── Daily job hunt ─────────────────────────────────────────────────────────
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'hunt' || github.event.inputs.job == 'both'))

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browser
        run: playwright install chromium --with-deps

      - name: Start SearXNG
        run: |
          if ! docker run -d --name searxng \
            -p 8080:8080 \
            -v "${{ github.workspace }}/.github/searxng/settings.yml:/etc/searxng/settings.yml:ro" \
            -e SEARXNG_SETTINGS_PATH=/etc/searxng/settings.yml \
            ghcr.io/searxng/searxng:latest; then
            echo "SearXNG container failed to start; continuing with other providers"
            exit 0
          fi

          for i in {1..30}; do
            if curl -fsS "http://127.0.0.1:8080/search?q=test&format=json" >/dev/null; then
              echo "SearXNG is ready"
              exit 0
            fi
            sleep 2
          done

          echo "SearXNG did not become ready; continuing with other providers"
          docker logs searxng || true

      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-pictures \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            lmodern

      - name: Run daily hunt
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          SEARXNG_BASE_URL: http://127.0.0.1:8080
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          LOG_LEVEL: INFO
        run: |
          cd $GITHUB_WORKSPACE
          PYTHONPATH=$GITHUB_WORKSPACE/scripts python scripts/pipeline/orchestrator.py

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: job-hunt-logs-${{ github.run_id }}
          path: job_hunt.log
          retention-days: 30

      - name: Commit results
        run: |
          git config user.name "job-hunt-bot"
          git config user.email "bot@job-hunt"
          git add jobs/ README.md config/applied_jobs.yml
          git diff --staged --quiet || git commit -m "jobs: $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git push

  # ── Weekly company discovery ────────────────────────────────────────────────
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 7 * * 1') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'discover' || github.event.inputs.job == 'both'))

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Start SearXNG
        run: |
          if ! docker run -d --name searxng \
            -p 8080:8080 \
            -v "${{ github.workspace }}/.github/searxng/settings.yml:/etc/searxng/settings.yml:ro" \
            -e SEARXNG_SETTINGS_PATH=/etc/searxng/settings.yml \
            ghcr.io/searxng/searxng:latest; then
            echo "SearXNG container failed to start; continuing with other providers"
            exit 0
          fi

          for i in {1..30}; do
            if curl -fsS "http://127.0.0.1:8080/search?q=test&format=json" >/dev/null; then
              echo "SearXNG is ready"
              exit 0
            fi
            sleep 2
          done

          echo "SearXNG did not become ready; continuing with other providers"
          docker logs searxng || true

      - name: Discover new companies
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          SEARXNG_BASE_URL: http://127.0.0.1:8080
          LOG_LEVEL: INFO
        run: |
          cd $GITHUB_WORKSPACE
          PYTHONPATH=$GITHUB_WORKSPACE/scripts python scripts/discovery/discoverer.py

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: company-discovery-logs-${{ github.run_id }}
          path: job_hunt.log
          retention-days: 30

      - name: Commit updated search_config.yml
        run: |
          git config user.name "job-hunt-bot"
          git config user.email "bot@job-hunt"
          git add config/search_config.yml
          git diff --staged --quiet || git commit -m "discover: $(date +%Y-%m-%d) added new companies"
          git pull --rebase origin main
          git push

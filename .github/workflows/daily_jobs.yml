name: Job Hunt Pipeline

on:
  schedule:
    - cron: '0 6 * * 1-5'   # daily job hunt Mon-Fri 6am UTC
    - cron: '0 7 * * 1'     # company discovery Mondays 7am UTC
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run'
        required: true
        default: 'hunt'
        type: choice
        options:
          - hunt
          - discover
          - both

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ── Daily job hunt ─────────────────────────────────────────────────────────
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'hunt' || github.event.inputs.job == 'both'))

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browser
        run: playwright install chromium --with-deps

      - name: Cache LaTeX
        uses: actions/cache@v4
        with:
          path: /usr/share/texlive
          key: texlive-full-v1

      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y texlive-full

      - name: Run daily hunt
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          LOG_LEVEL: INFO
        run: |
          cd $GITHUB_WORKSPACE
          PYTHONPATH=$GITHUB_WORKSPACE/scripts python scripts/pipeline/orchestrator.py

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-hunt-logs-${{ github.run_id }}
          path: job_hunt.log
          retention-days: 30

      - name: Commit results
        run: |
          git config user.name "job-hunt-bot"
          git config user.email "bot@job-hunt"
          git add README.md config/applied_jobs.yml
          find jobs -maxdepth 2 -type f \( \
            -name meta.json -o \
            -name jd.md -o \
            -name cover_letter.md -o \
            -name cover_letter.pdf -o \
            -name resume_tailored.tex -o \
            -name resume_tailored.pdf \
          \) -print0 | xargs -0 -r git add -f --
          git diff --staged --quiet || git commit -m "jobs: $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git push

  # ── Weekly company discovery ────────────────────────────────────────────────
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 7 * * 1') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'discover' || github.event.inputs.job == 'both'))

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Discover new companies
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          LOG_LEVEL: INFO
        run: |
          cd $GITHUB_WORKSPACE
          PYTHONPATH=$GITHUB_WORKSPACE/scripts python scripts/discovery/discoverer.py

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: company-discovery-logs-${{ github.run_id }}
          path: job_hunt.log
          retention-days: 30

      - name: Commit updated search_config.yml
        run: |
          git config user.name "job-hunt-bot"
          git config user.email "bot@job-hunt"
          git add config/search_config.yml
          git diff --staged --quiet || git commit -m "discover: $(date +%Y-%m-%d) added new companies"
          git pull --rebase origin main
          git push

name: Update From Template

on:
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: "Template repository to pull updates from"
        required: true
        default: "Job-Network-Projects/job-hunter-template"
        type: string
      upstream_branch:
        description: "Template branch to pull updates from"
        required: true
        default: "main"
        type: string
      update_config:
        description: "Also update config files from the template"
        required: true
        default: false
        type: boolean
      update_linkedin:
        description: "Also add/update the starter linkedin folder"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Copy template updates into a pull request branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEMPLATE_REPO_PAT: ${{ secrets.TEMPLATE_REPO_PAT }}
          UPSTREAM_REPO: ${{ inputs.upstream_repo }}
          UPSTREAM_BRANCH: ${{ inputs.upstream_branch }}
          UPDATE_CONFIG: ${{ inputs.update_config }}
          UPDATE_LINKEDIN: ${{ inputs.update_linkedin }}
        run: |
          set -euo pipefail

          git config user.name "template-update-bot"
          git config user.email "template-update-bot@users.noreply.github.com"

          git remote remove upstream 2>/dev/null || true
          if [ -n "${TEMPLATE_REPO_PAT}" ]; then
            git remote add upstream "https://x-access-token:${TEMPLATE_REPO_PAT}@github.com/${UPSTREAM_REPO}.git"
          else
            git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          fi

          if ! git fetch upstream "${UPSTREAM_BRANCH}"; then
            echo "::error::Could not fetch ${UPSTREAM_REPO}@${UPSTREAM_BRANCH}."
            echo "::error::If the template repository is private, add a TEMPLATE_REPO_PAT repository secret with read access to ${UPSTREAM_REPO}."
            exit 1
          fi

          branch="template-update/${GITHUB_RUN_ID}"
          git checkout -b "$branch"

          paths=(
            ".github/searxng"
            ".github/workflows/build_runner_image.yml"
            ".github/workflows/daily_jobs.yml"
            ".github/workflows/linkedin_content.yml"
            ".github/workflows/tailor_links.yml"
            ".github/workflows/update_from_template.yml"
            ".dockerignore"
            ".gitignore"
            "Dockerfile"
            "CHANGELOG.md"
            "README.md"
            "SETUP.md"
            "VERSION"
            "altacv.cls"
            "requirements.txt"
            "scripts"
            "tests"
          )

          if [ "$UPDATE_CONFIG" = "true" ]; then
            paths+=("config")
          fi

          if [ "$UPDATE_LINKEDIN" = "true" ]; then
            paths+=("linkedin")
          fi

          current_version="$(cat VERSION 2>/dev/null || true)"
          upstream_version="$(git show "upstream/${UPSTREAM_BRANCH}:VERSION" 2>/dev/null || true)"
          changelog_excerpt="$(git show "upstream/${UPSTREAM_BRANCH}:CHANGELOG.md" 2>/dev/null | sed -n '1,35p' || true)"

          semver_level="unknown"
          semver_summary="Could not compare template versions."
          if [ -z "$current_version" ] && [ -n "$upstream_version" ]; then
            semver_level="initial"
            semver_summary="This repository does not have a recorded template version yet. It will be updated to ${upstream_version}."
          elif [[ "$current_version" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]] && \
               [[ "$upstream_version" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            IFS='.' read -r current_major current_minor current_patch <<< "$current_version"
            IFS='.' read -r upstream_major upstream_minor upstream_patch <<< "$upstream_version"
            if [ "$upstream_major" -gt "$current_major" ]; then
              semver_level="major"
              semver_summary="Major update: review setup, workflow, and config changes carefully before merging."
            elif [ "$upstream_major" -eq "$current_major" ] && [ "$upstream_minor" -gt "$current_minor" ]; then
              semver_level="minor"
              semver_summary="Minor update: new backward-compatible template functionality."
            elif [ "$upstream_major" -eq "$current_major" ] && \
                 [ "$upstream_minor" -eq "$current_minor" ] && \
                 [ "$upstream_patch" -gt "$current_patch" ]; then
              semver_level="patch"
              semver_summary="Patch update: fixes, cleanup, or documentation improvements."
            elif [ "$upstream_version" = "$current_version" ]; then
              semver_level="same"
              semver_summary="Template version is unchanged, but maintained files may still differ."
            else
              semver_level="local-newer"
              semver_summary="This repository appears to have a newer template version than the selected upstream."
            fi
          fi

          git checkout "upstream/${UPSTREAM_BRANCH}" -- "${paths[@]}"
          git add "${paths[@]}"

          if git diff --cached --quiet; then
            echo "This repository already has the selected template files."
            exit 0
          fi

          if [ -n "$upstream_version" ]; then
            commit_title="chore: update job hunt template to v${upstream_version}"
          else
            commit_title="chore: update from job hunt template"
          fi

          git commit -m "$commit_title"
          git push --force-with-lease origin "$branch"

          pr_body="$(mktemp)"
          {
            echo "This PR updates the maintained template files from \`${UPSTREAM_REPO}@${UPSTREAM_BRANCH}\`."
            echo
            echo "Semantic versioning summary:"
            echo
            echo "- Current version: \`${current_version:-unknown}\`"
            echo "- Upstream version: \`${upstream_version:-unknown}\`"
            echo "- Update type: \`${semver_level}\`"
            echo "- Meaning: $semver_summary"
            echo
            echo "Versioning rules:"
            echo
            echo "- \`PATCH\`: fixes, cleanup, or documentation updates."
            echo "- \`MINOR\`: backward-compatible new features."
            echo "- \`MAJOR\`: breaking setup, workflow, or config changes."
            echo
            if [ -n "$upstream_version" ]; then
              echo "Template version: \`${upstream_version}\`"
              echo
            fi
            echo "Personal files are preserved by default:"
            echo
            echo "- resumes"
            echo "- story bank"
            echo "- project instructions"
            echo "- generated jobs"
            echo "- config files, unless \`update_config\` was enabled"
            echo "- LinkedIn workspace, unless \`update_linkedin\` was enabled"
            echo
            if [ "$semver_level" = "major" ]; then
              echo "> Important: this is a major template update. Read the changelog and review setup/config changes before merging."
              echo
            fi
            echo "Review the changed files, then merge this PR when ready."
            if [ -n "$changelog_excerpt" ]; then
              echo
              echo "Recent template changelog:"
              echo
              echo '```markdown'
              echo "$changelog_excerpt"
              echo '```'
            fi
          } > "$pr_body"

          existing_pr="$(gh pr list --head "$branch" --json number --jq '.[0].number // empty')"
          if [ -n "$upstream_version" ]; then
            pr_title="chore: update job hunt template to v${upstream_version} (${semver_level})"
          else
            pr_title="chore: update from job hunt template"
          fi

          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" --title "$pr_title" --body-file "$pr_body"
            echo "Updated existing PR #$existing_pr."
          else
            gh pr create \
              --base "${GITHUB_REF_NAME}" \
              --head "$branch" \
              --title "$pr_title" \
              --body-file "$pr_body"
          fi

# API and LLM configuration for the shareable template repo.
# Store real secret values in environment variables, GitHub Actions secrets, or
# your local keyring. Do not commit API keys.

llm:
  # The matching Python SDK must be installed from requirements.txt.
  default_provider: anthropic
  providers:
    validation: anthropic
    scoring: anthropic
    tailoring: anthropic
    cover_letter: anthropic
    discovery: anthropic
    linkedin: anthropic
    jd_extraction: anthropic
    ai_web_search: anthropic
  models:
    # Model names must match the provider configured for each role above.
    # If you switch providers, replace these with model names from that provider.
    validation: "claude-haiku-4-5-20251001"
    scoring: "claude-haiku-4-5-20251001"
    tailoring: "claude-sonnet-4-6"
    cover_letter: "claude-sonnet-4-6"
    discovery: "claude-sonnet-4-6"
    linkedin: "claude-sonnet-4-6"
    jd_extraction: "claude-haiku-4-5-20251001"
    ai_web_search: "claude-haiku-4-5-20251001"  # may 529 at peak hours; switch to sonnet if reliability matters more than cost
  max_tokens:
    validation: 200
    scoring: 500
    tailoring: 4000
    cover_letter: 800
    discovery: 400
    linkedin: 3000
    jd_extraction: 1500
    ai_web_search: 1200

ollama:
  base_url: "http://localhost:11434"

secrets:
  # Set required: true only for providers used in llm.default_provider or
  # llm.providers.*; set unused providers to false.
  anthropic:
    env_var: "ANTHROPIC_API_KEY"
    required: true
  openai:
    env_var: "OPENAI_API_KEY"
    required: false
  google:
    env_var: "GOOGLE_API_KEY"
    required: false
  brave:
    env_var: "BRAVE_API_KEY"
    required: false
  tavily:
    env_var: "TAVILY_API_KEY"
    required: false
  exa:
    env_var: "EXA_API_KEY"
    required: false
  rapidapi:
    env_var: "RAPIDAPI_KEY"
    required: false

http:
  url_verification:
    enabled: true
    timeout_seconds: 5
  brave_search:
    timeout_seconds: 15
    results_per_query: 10
  search_providers:
    max_consecutive_failures: 3
    order:
      - searxng
      - brave
      - tavily
      - exa
    searxng_base_url: "http://127.0.0.1:8080"
    ai_web_search:
      enabled: false
      # Queries are title + region only; company names are never included.
      prompt_delay_seconds: 5         # pause between prompts to avoid overloading the web-search endpoint
      max_prompts_per_run: 30
      max_prompts_per_region: 10
      max_results_per_prompt: 8
      max_results_per_region: 30
      max_total_results_per_run: 60
      sources:
        linkedin:
          # LinkedIn blocks Google from indexing individual job pages, so this
          # source only works with Anthropic and OpenAI web-search tools.
          # Disable it here if using the google provider to avoid empty results.
          enabled: true
          query_templates:
            - 'site:linkedin.com/jobs/view "{title}" "{location}"'
        stepstone:
          enabled: true
          query_templates:
            - 'site:stepstone.de/stellenangebote-- "{title}" "{location}"'
        generic_web:
          enabled: true
          query_templates:
            - '"{title}" "{location}" careers apply'
  ats_scraper:
    timeout_seconds: 10
  job_boards:
    timeout_seconds: 10
    max_consecutive_failures: 3

profile:
  # Available resume templates:
  # - resume_double_column.tex: AltaCV double-column layout
  # - resume_single_column.tex: ATS-friendly single-column layout
  resume_tex: "resume_double_column.tex"
  story_bank: "story_bank.md"
  project_instructions: "project_instructions.md"
  profile_image: "profile-placeholder.png"
  latex_class: "altacv.cls"
  output_dir: "jobs"

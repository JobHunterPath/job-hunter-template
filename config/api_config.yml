# API and LLM configuration for the shareable template repo.
# Store real secret values in environment variables, GitHub Actions secrets, or
# your local keyring. Do not commit API keys.

llm:
  # The matching Python SDK must be installed from requirements.txt.
  default_provider: anthropic
  providers:
    validation: anthropic
    scoring: anthropic
    tailoring: anthropic
    cover_letter: anthropic
    discovery: anthropic
    linkedin: anthropic
    jd_extraction: anthropic
  models:
    # Model names must match the provider configured for each role above.
    # If you switch providers, replace these with model names from that provider.
    validation: "claude-haiku-4-5-20251001"
    scoring: "claude-haiku-4-5-20251001"
    tailoring: "claude-sonnet-4-6"
    cover_letter: "claude-sonnet-4-6"
    discovery: "claude-sonnet-4-6"
    linkedin: "claude-sonnet-4-6"
    jd_extraction: "claude-haiku-4-5-20251001"
  max_tokens:
    validation: 200
    scoring: 500
    tailoring: 4000
    cover_letter: 800
    discovery: 400
    linkedin: 3000
    jd_extraction: 1500

ollama:
  base_url: "http://localhost:11434"

secrets:
  # Set required: true only for providers used in llm.default_provider or
  # llm.providers.*; set unused providers to false.
  anthropic:
    env_var: "ANTHROPIC_API_KEY"
    required: true
  openai:
    env_var: "OPENAI_API_KEY"
    required: false
  google:
    env_var: "GOOGLE_API_KEY"
    required: false
  brave:
    env_var: "BRAVE_API_KEY"
    required: false
  tavily:
    env_var: "TAVILY_API_KEY"
    required: false
  exa:
    env_var: "EXA_API_KEY"
    required: false
  rapidapi:
    env_var: "RAPIDAPI_KEY"
    required: false

http:
  url_verification:
    enabled: true
    timeout_seconds: 5
  brave_search:
    timeout_seconds: 15
    results_per_query: 10
  search_providers:
    order:
      - searxng
      - brave
      - tavily
      - exa
    searxng_base_url: "http://127.0.0.1:8080"
  ats_scraper:
    timeout_seconds: 10
  job_boards:
    timeout_seconds: 10

profile:
  # Available resume templates:
  # - resume_double_column.tex: AltaCV double-column layout
  # - resume_single_column.tex: ATS-friendly single-column layout
  resume_tex: "resume_double_column.tex"
  story_bank: "story_bank.md"
  project_instructions: "project_instructions.md"
  profile_image: "profile-placeholder.png"
  latex_class: "altacv.cls"
  output_dir: "jobs"
